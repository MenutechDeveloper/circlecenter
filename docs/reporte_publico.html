<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Reporte del Candidato | CircleCenter</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .pdf-capture {
      box-shadow: none !important;
      border-radius: 0 !important;
    }
    .pdf-capture [class*="max-h-"] {
      max-height: none !important;
    }
    .pdf-capture [class*="overflow-"] {
      overflow: visible !important;
    }
    .pdf-capture .pdf-question img {
      max-height: 240mm !important;
    }
    @media print {
      * {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
      body {
        background: #fff !important;
      }
      main {
        max-width: 100% !important;
        width: 100% !important;
        margin: 0 !important;
        padding: 0 !important;
      }
      .no-print {
        display: none !important;
      }
      #public-report {
        max-width: 100% !important;
        width: 100% !important;
        margin: 0 !important;
        border: none !important;
        border-radius: 0 !important;
        box-shadow: none !important;
      }
      .report-header {
        background: #fff !important;
        color: #1f2937 !important;
        border-bottom: 3px solid #60a5fa !important;
      }
      .report-header h1,
      .report-header p {
        color: #1f2937 !important;
      }
      .report-header .header-icon {
        background: #dbeafe !important;
        color: #2563eb !important;
      }
      [class*="max-h-"] {
        max-height: none !important;
      }
      [class*="overflow-"] {
        overflow: visible !important;
      }
      .pdf-question img {
        max-height: 240mm !important;
      }
      @page {
        size: A4;
        margin: 12mm;
      }
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen">
  <main class="max-w-4xl mx-auto p-4 sm:p-8">
    <div id="public-status" class="hidden bg-white rounded-2xl border border-rose-100 p-6 text-center text-sm text-gray-600 shadow-sm"></div>
    <div id="public-report" class="hidden bg-white rounded-3xl border border-blue-100 shadow-xl overflow-hidden"></div>
    <div class="no-print mt-5 flex items-center justify-center gap-3">
      <button id="download-btn" class="hidden px-5 py-2.5 bg-blue-500 hover:bg-blue-600 text-white font-bold rounded-xl text-sm shadow-md transition">
        <i class="fa-solid fa-file-arrow-down mr-1"></i> Descargar PDF
      </button>
      <button id="close-btn" class="px-5 py-2.5 bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold rounded-xl text-sm transition">
        Cerrar
      </button>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/code_similarity.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="js/public_report.js"></script>
</body>
</html>
